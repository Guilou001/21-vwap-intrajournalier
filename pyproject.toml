[project]
name = "vwp"
version = "1.0.0"
description = "Le signal VWAP de Zarattini et Aziz, rejoué : ce que le glissement lui coûte, et ce qui en reste après publication"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Guillaume Vaudescal" }]
dependencies = [
    "gvf[figures,marches]>=0.4.0",
    "matplotlib>=3.9",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "scipy>=1.13",
    "typer>=0.12",
]

[project.scripts]
vwp = "vwp.cli:app"

[project.urls]
Homepage = "https://github.com/Guilou001/21-vwap-intrajournalier"

[tool.uv.sources]
gvf = { git = "https://github.com/Guilou001/gv-fintools", tag = "v0.4.0" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vwp"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
